<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Nora</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Nora</div>
      <button class="inventory-button" id="inventory-open" type="button" aria-controls="inventory-panel" aria-expanded="false">
        <span class="list-icon" aria-hidden="true">&#9776;</span>
        Inventory
      </button>
    </header>

    <main class="chat-shell">
      <section class="conversation" aria-label="Conversation">
        <div class="welcome">
          <div class="mark" aria-hidden="true">N</div>
          <h1>What's in the fridge?</h1>
        </div>

        <div class="composer-wrap">
          <form class="composer" id="chat-form">
            <label class="sr-only" for="message">Message Nora</label>
            <textarea id="message" rows="1" placeholder="Message Nora" autocomplete="off"></textarea>
            <div class="composer-actions">
              <button class="icon-button" type="button" title="Attach image" aria-label="Attach image">+</button>
              <button class="send-button" type="submit" title="Send message" aria-label="Send message">&#8593;</button>
            </div>
          </form>
          <p class="status" id="status" aria-live="polite">Static deployment check</p>
        </div>
      </section>
    </main>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="inventory-panel" id="inventory-panel" aria-label="Current inventory" aria-hidden="true">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Fridge</p>
          <h2>Current inventory</h2>
        </div>
        <button class="icon-button" id="inventory-close" type="button" title="Close inventory" aria-label="Close inventory">&#10005;</button>
      </div>

      <div class="category">
        <h3>Dairy</h3>
        <div class="inventory-row">
          <div>
            <strong>Full-fat milk</strong>
            <span>2 cartons</span>
          </div>
          <span class="date">Sep 28</span>
        </div>
        <div class="inventory-row">
          <div>
            <strong>Eggs</strong>
            <span>8 count</span>
          </div>
          <span class="date estimated">Oct 2</span>
        </div>
      </div>

      <div class="category">
        <h3>Produce</h3>
        <div class="inventory-row">
          <div>
            <strong>Spinach</strong>
            <span>1 bag</span>
          </div>
          <span class="date estimated">Sep 19</span>
        </div>
      </div>
    </aside>
  </body>
</html>
